name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. v1.5.5). Leave blank to default to "dev".'
        required: false
        default: ''

jobs:
  build-mac:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          pyinstaller GECKO_mac.spec

      - name: Determine filename
        id: name
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="dev"
          fi
          if [[ "${{ matrix.os }}" == *"intel"* ]]; then
            echo "filename=GECKO_${VER}_macOS-Intel" >> $GITHUB_OUTPUT
          else
            echo "filename=GECKO_${VER}_macOS-AppleSilicon" >> $GITHUB_OUTPUT
          fi

      - name: Zip .app
        run: |
          cd dist
          zip -r ${{ steps.name.outputs.filename }}.zip GECKO.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.filename }}
          path: dist/${{ steps.name.outputs.filename }}.zip
