name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-mac:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          pyinstaller GECKO_mac.spec

      - name: Determine Architecture Suffix
        id: arch
        run: |
          if [[ "${{ matrix.os }}" == *"intel"* ]]; then
            echo "suffix=Intel-x64" >> $GITHUB_OUTPUT
          else
            echo "suffix=AppleSilicon-arm64" >> $GITHUB_OUTPUT
          fi

      - name: Zip .app
        run: |
          cd dist
          zip -r GECKO-${{ steps.arch.outputs.suffix }}.zip GECKO.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GECKO-mac-${{ steps.arch.outputs.suffix }}
          path: dist/GECKO-${{ steps.arch.outputs.suffix }}.zip
