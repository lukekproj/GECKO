name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          pyinstaller GECKO_mac.spec

      - name: Zip .app
        run: |
          cd dist
          zip -r GECKO.zip GECKO.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GECKO-mac
          path: dist/GECKO.zip
